[project]
name = "lvgl"
version = "0.1.2"
description = "README.md"
authors = [{name = "Kevin G. Schlosser"}, {name="Many other contributors"}]
maintainers = [{name = "Kevin G. Schlosser"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Intended Audience :: Developers",
    "Topic :: Home Automation",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Software Development :: User Interfaces",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: POSIX :: BSD",
    "Operating System :: POSIX :: Linux",
    "Operating System :: POSIX :: SunOS/Solaris",
    "Operating System :: MacOS :: MacOS X"
]
keywords = ["LVGL", "LV", "lvgl", "lv", "graphics", "gui", "gui framework"]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.9"
dependencies=[
    "cffi>=1.15.1",
    "cryptolib>=0.0.2",
    "pip>=26.0.1",
    "secp256k1>=0.14.0",
    "setuptools>=82.0.1",
    "websocket>=0.2.1",
    "websockets>=15.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not sdl and not stress'"
markers = [
    "acceptance: MicroPythonOS-shaped CPython acceptance tests",
    "integration: tests that exercise optional LVGL integrations",
    "lifetime: memory-lifetime regression tests",
    "sdl: tests that require SDL and a display environment",
    "stress: slow tests that repeat lifetime cases many times",
    "subprocess: tests isolated in a child process",
]


[project.urls]
Homepage = "https://github.com/kdschlosser/lv_cpython"
Documentation = "https://docs.lvgl.io/master/index.html"
Repository = "https://github.com/kdschlosser/lv_cpython"
Issues = "https://github.com/kdschlosser/lv_cpython/issues"
Forum = "https://forum.lvgl.io/"


[build-system]
requires=[
    "setuptools>=67.8.0",
    "wheel>=0.40.0",
    "pyMSVC>=0.5.3;sys_platform=='win32'",
    "requests>=2.3.0;sys_platform=='win32'",
    "pycparser>=2.21,<3",
    "cffi>=1.15.1"
]
build-backend="setuptools.build_meta"
